<div>
  <form
    tuiForm="l"
    [formGroup]="data"
  >


    <div >
      <tui-textfield [stringify]="'name' | tuiStringify">
        <input
          tuiSelect
          formControlName="cityId"
        />

        <tui-data-list-wrapper
          *tuiLet="cities$ | async as citiiis"
          new
          [itemContent]="itemContent"
          [items]="citiiis"
        />
        <ng-template
          #itemContent
          let-data
        >
          <div>

            {{ data.name }}
          </div>
        </ng-template>
      </tui-textfield>


    </div>


  </form>
</div>
