<div class="main-page-container" *ngIf="ads$ | async as ads">
   <div class="favorite-ads-container">
     <app-ad-card (deleteCard)="deleteCardById($event)"
                  class="ad-card-container"
                  *ngFor="let ad of ads"
                  [ad] = "ad"
     ></app-ad-card>
   </div>
</div>
