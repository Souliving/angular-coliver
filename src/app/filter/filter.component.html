<div class="filter-container">
  <form
      tuiForm="l"
      [formGroup]="filterForm"
  >

    <fieldset>

      <div class="form-stack">
        <button
            tuiButton
            appearance="outline"
            size="l"
            type="button"
            class="filter-button"
            [tuiDropdown]="preferencesDropdown"
            [(tuiDropdownOpen)]="preferencesOpen"
        >
          Предпочтения
          <tui-icon [icon]="preferencesOpen ? '@tui.chevron-up' : '@tui.chevron-down'"></tui-icon>
        </button>
        <ng-template #preferencesDropdown>
          <div class="dropdown-content">
            <label tuiLabel>
              <input
                  tuiCheckbox
                  type="checkbox"
                  formControlName="smoking"
              />
              Не курит
            </label>
            <label tuiLabel>
              <input
                  tuiCheckbox
                  type="checkbox"
                  formControlName="alcohol"
              />
              Не пьет
            </label>
            <label tuiLabel>
              <input
                  tuiCheckbox
                  type="checkbox"
                  formControlName="petFriendly"
              />
              Не против животных
            </label>
            <label tuiLabel>
              <input
                  tuiCheckbox
                  type="checkbox"
                  formControlName="isClean"
              />
              Чистоплотный
            </label>
          </div>
        </ng-template>
      </div>
      <div class="form-stack">
        <button
            tuiButton
            appearance="outline"
            size="l"
            type="button"
            class="filter-button"
            [tuiDropdown]="ageDropdown"
            [(tuiDropdownOpen)]="ageOpen"
        >
          Укажите возраст
          <tui-icon [icon]="ageOpen ? '@tui.chevron-up' : '@tui.chevron-down'"></tui-icon>
        </button>
        <ng-template #ageDropdown>
          <div class="dropdown-content dropdown-content--range">
            <tui-input-range
                [max]="maxAge"
                [min]="minAge"
                formControlName="age"
                [quantum]="quantum"
                [steps]="stepsAge"
                [tuiTextfieldLabelOutside]=true
            >
            </tui-input-range>
          </div>
        </ng-template>
      </div>
      <div class="form-stack">
        <button
            tuiButton
            appearance="outline"
            size="l"
            type="button"
            class="filter-button"
            [tuiDropdown]="priceDropdown"
            [(tuiDropdownOpen)]="priceOpen"
        >
          Укажите цену
          <tui-icon [icon]="priceOpen ? '@tui.chevron-up' : '@tui.chevron-down'"></tui-icon>
        </button>
        <ng-template #priceDropdown>
          <div class="dropdown-content dropdown-content--range">
            <tui-input-range
                formControlName="price"
                [max]="maxPrice"
                [min]="minPrice"
                [quantum]="quantum"
                [steps]="stepsBudget"
                [tuiTextfieldLabelOutside]=true
            >
            </tui-input-range>
          </div>
        </ng-template>
      </div>
      <div class="form-stack">
        <button
            size="l"
            tuiButton
            type="button"
            (click)="openFilterDialog()"
        >
          Локация
        </button>
      </div>
      <div class="form-stack">
        <button
            appearance="outline"
            tuiButton
            type="button"
            size="l"
            (click)="submitForm()"
        >
          Найти
        </button>
      </div>
      <div class="form-stack">
        <button
            appearance="outline"
            tuiButton
            type="button"
            size="l"
            (click)="toCleanForm()"
        >
          Сбросить
        </button>
      </div>


    </fieldset>

  </form>
</div>
