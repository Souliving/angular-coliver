 <div class="filter-container">
        <form [formGroup]="filterForm"  >
            <mat-accordion multi="false" class="filter-container__form">
            <mat-expansion-panel>
                <mat-expansion-panel-header>
                  <mat-panel-title> Выберите пердпочтения </mat-panel-title>
                </mat-expansion-panel-header>
                @for (preference of allPreferences; track preference) {
                    <mat-option 
                    [value]="preference.value" 
                    (click)="updatePreference(preference.value, !filterForm.get(preference.value)?.value)"
                    >
                        {{preference.display}}
                    </mat-option>
                }
            </mat-expansion-panel>

            <mat-expansion-panel formGroupName="age">
                <mat-expansion-panel-header>
                  <mat-panel-title> Укажите возраст </mat-panel-title>
                </mat-expansion-panel-header>
                <div class="age_inputs">
                    <mat-form-field class="example-form-field">
                        <mat-label>Возраст от: </mat-label>
                        <input matInput type="number" formControlName="startAge" [value] = "filterForm.get('age.startAge')?.value"> 
                    </mat-form-field>

                    <mat-form-field>
                    <mat-label>до:  </mat-label>
                        <input matInput type="number" formControlName="endAge" [value] = "filterForm.get('age.endAge')?.value">
                    </mat-form-field>
                </div>
            </mat-expansion-panel>

            <mat-expansion-panel formGroupName="price">
                <mat-expansion-panel-header>
                  <mat-panel-title> Укажите бюджет </mat-panel-title>
                </mat-expansion-panel-header>
                <div class="price_inputs">
                    <mat-form-field class="example-form-field">
                        <mat-label>Цена от:</mat-label>
                        <input matInput type="number" formControlName="startPrice" [value] = "filterForm.get('price.startPrice')?.value"> 
                    </mat-form-field>
                    <mat-form-field class="example-form-field">
                        <mat-label>до:</mat-label>
                        <input matInput type="number" formControlName="endPrice" [value] = "filterForm.get('price.endPrice')?.value"> 
                    </mat-form-field>
                </div>
            </mat-expansion-panel>
          
            <!-- Местоположение -->
            <button mat-raised-button (click)="openFilterDialog()">
                @if(currentCity.id){{{currentCity.name}}}
                @else {Выберите локацию}</button>
          
            <button mat-button (click)="submitForm()">Отправить</button>
            </mat-accordion>
          </form>
          
          
</div>
