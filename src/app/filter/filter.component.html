<mat-expansion-panel>
    <mat-expansion-panel-header>
      <mat-panel-title> Настройте фильтр </mat-panel-title>
    </mat-expansion-panel-header>
    <div class="filter-container">
        <form [formGroup]="filterForm" (ngSubmit)="submitForm()" class="filter-container__form">
            <!-- Группа предпочтений с чекбоксами -->
            <mat-form-field>
                <mat-label>Выберите пердпочтения</mat-label>
                <mat-select formControlName="preferences" multiple>
                     @for (preference of allPreferences; track preference) {
                        <mat-option [value]="preference.value" >{{preference.display}}</mat-option>
                    }
                </mat-select> 
            </mat-form-field>

            <div formGroupName="age">
                <div class="age_inputs">
                    <mat-form-field class="example-form-field">
                        <mat-label>Возраст от: </mat-label>
                        <input matInput type="number" formControlName="from" [value] = "filterForm.get('age.from')?.value"> 
                    </mat-form-field>

                    <mat-form-field>
                    <mat-label>до:  </mat-label>
                        <input matInput type="number" formControlName="to" [value] = "filterForm.get('age.to')?.value">
                    </mat-form-field>
                </div>
                
                <mat-slider min="18" max="120">
                    <input formControlName="from" value="18" matSliderStartThumb [value] = "filterForm.get('age.from')?.value">
                    <input formControlName="to" value="120" matSliderEndThumb [value] = "filterForm.get('age.to')?.value">
                </mat-slider>
                
            </div>

            <div formGroupName="price">
                <div class="price_inputs">
                    <mat-form-field class="example-form-field">
                        <mat-label>Цена от:</mat-label>
                        <input matInput type="number" formControlName="from" [value] = "filterForm.get('price.from')?.value"> 
                    </mat-form-field>
                    <mat-form-field class="example-form-field">
                        <mat-label>до:</mat-label>
                        <input matInput type="number" formControlName="from" [value] = "filterForm.get('price.to')?.value"> 
                    </mat-form-field>
                </div>
                <mat-slider min="18" max="120">
                <input
                formControlName="from"
                matSliderStartThumb 
                [value]="filterForm.get('price.from')?.value"
                />
        
                <input
                    formControlName="to"
                    matSliderEndThumb
                    [value]="filterForm.get('price.to')?.value"
                    />
                </mat-slider>
              </div>

            <!-- Местоположение -->
            <button mat-raised-button (click)="openFilterDialog()">Выберите локацию</button>
