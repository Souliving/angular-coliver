<div class="filter-container">
  <form
      tuiForm="l"
      [formGroup]="filterForm"
  >

    <fieldset>

      <div class="form-stack">
        <button
            tuiButton
            appearance="outline"
            size="l"
            type="button"
            class="filter-button"
            [tuiDropdown]="preferencesDropdown"
            [(tuiDropdownOpen)]="preferencesOpen"
        >
          Предпочтения
          <tui-icon [icon]="preferencesOpen ? '@tui.chevron-up' : '@tui.chevron-down'"></tui-icon>
        </button>
        <ng-template #preferencesDropdown>
          <div class="dropdown-content" style="display: flex; flex-direction: column; gap: 16px;">
            <div>
              <div style="font-weight: 500; margin-bottom: 8px;">Курение</div>
              <label tuiLabel style="display: flex; align-items: center; margin-bottom: 4px;">
                <input tuiRadio type="radio" formControlName="smoking" value="NO" />
                Не курит
              </label>
              <label tuiLabel style="display: flex; align-items: center; margin-bottom: 4px;">
                <input tuiRadio type="radio" formControlName="smoking" value="YES" />
                Курит
              </label>
              <label tuiLabel style="display: flex; align-items: center;">
                <input tuiRadio type="radio" formControlName="smoking" value="ANY" />
                Не важно
              </label>
            </div>

            <div>
              <div style="font-weight: 500; margin-bottom: 8px;">Алкоголь</div>
              <label tuiLabel style="display: flex; align-items: center; margin-bottom: 4px;">
                <input tuiRadio type="radio" formControlName="alcohol" value="NO" />
                Не пьет
              </label>
              <label tuiLabel style="display: flex; align-items: center; margin-bottom: 4px;">
                <input tuiRadio type="radio" formControlName="alcohol" value="YES" />
                Пьет
              </label>
              <label tuiLabel style="display: flex; align-items: center;">
                <input tuiRadio type="radio" formControlName="alcohol" value="ANY" />
                Не важно
              </label>
            </div>

            <div>
              <div style="font-weight: 500; margin-bottom: 8px;">Животные</div>
              <label tuiLabel style="display: flex; align-items: center; margin-bottom: 4px;">
                <input tuiRadio type="radio" formControlName="petFriendly" value="YES" />
                Не против животных
              </label>
              <label tuiLabel style="display: flex; align-items: center; margin-bottom: 4px;">
                <input tuiRadio type="radio" formControlName="petFriendly" value="NO" />
                Против животных
              </label>
              <label tuiLabel style="display: flex; align-items: center;">
                <input tuiRadio type="radio" formControlName="petFriendly" value="ANY" />
                Не важно
              </label>
            </div>

            <div>
              <div style="font-weight: 500; margin-bottom: 8px;">Чистоплотность</div>
              <label tuiLabel style="display: flex; align-items: center; margin-bottom: 4px;">
                <input tuiRadio type="radio" formControlName="isClean" value="YES" />
                Чистоплотный
              </label>
              <label tuiLabel style="display: flex; align-items: center; margin-bottom: 4px;">
                <input tuiRadio type="radio" formControlName="isClean" value="NO" />
                Не чистоплотный
              </label>
              <label tuiLabel style="display: flex; align-items: center;">
                <input tuiRadio type="radio" formControlName="isClean" value="ANY" />
                Не важно
              </label>
            </div>
          </div>
        </ng-template>
      </div>
      <div class="form-stack">
        <button
            tuiButton
            appearance="outline"
            size="l"
            type="button"
            class="filter-button"
            [tuiDropdown]="ageDropdown"
            [(tuiDropdownOpen)]="ageOpen"
        >
          Укажите возраст
          <tui-icon [icon]="ageOpen ? '@tui.chevron-up' : '@tui.chevron-down'"></tui-icon>
        </button>
        <ng-template #ageDropdown>
          <div class="dropdown-content dropdown-content--range">
            <tui-input-range
                [max]="maxAge"
                [min]="minAge"
                formControlName="age"
                [quantum]="quantum"
                [steps]="stepsAge"
                [tuiTextfieldLabelOutside]=true
            >
            </tui-input-range>
          </div>
        </ng-template>
      </div>
      <div class="form-stack">
        <button
            tuiButton
            appearance="outline"
            size="l"
            type="button"
            class="filter-button"
            [tuiDropdown]="priceDropdown"
            [(tuiDropdownOpen)]="priceOpen"
        >
          Укажите цену
          <tui-icon [icon]="priceOpen ? '@tui.chevron-up' : '@tui.chevron-down'"></tui-icon>
        </button>
        <ng-template #priceDropdown>
          <div class="dropdown-content dropdown-content--range">
            <tui-input-range
                formControlName="price"
                [max]="maxPrice"
                [min]="minPrice"
                [quantum]="quantum"
                [steps]="stepsBudget"
                [tuiTextfieldLabelOutside]=true
            >
            </tui-input-range>
          </div>
        </ng-template>
      </div>
      <div class="form-stack">
        <button
            size="l"
            tuiButton
            type="button"
            (click)="openFilterDialog()"
        >
          Локация
        </button>
      </div>
      <div class="form-stack">
        <button
            appearance="outline"
            tuiButton
            type="button"
            size="l"
            (click)="submitForm()"
        >
          Найти
        </button>
      </div>
      <div class="form-stack">
        <button
            appearance="outline"
            tuiButton
            type="button"
            size="l"
            (click)="toCleanForm()"
        >
          Сбросить
        </button>
      </div>


    </fieldset>

  </form>
</div>
