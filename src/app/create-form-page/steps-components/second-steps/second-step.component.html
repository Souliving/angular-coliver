<form  [formGroup]="secondStepGroup" class="second-step-container">
    <div style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px;">
      <h3 style="margin: 0;">Предпочтения коливера</h3>

      <div>
        <div style="font-weight: 500; margin-bottom: 8px;">Курение</div>
        <label tuiLabel style="display: flex; align-items: center; margin-bottom: 4px;">
          <input tuiRadio type="radio" formControlName="smoking" value="NO" />
          Не курит
        </label>
        <label tuiLabel style="display: flex; align-items: center; margin-bottom: 4px;">
          <input tuiRadio type="radio" formControlName="smoking" value="YES" />
          Курит
        </label>
        <label tuiLabel style="display: flex; align-items: center;">
          <input tuiRadio type="radio" formControlName="smoking" value="ANY" />
          Не важно
        </label>
      </div>

      <div>
        <div style="font-weight: 500; margin-bottom: 8px;">Алкоголь</div>
        <label tuiLabel style="display: flex; align-items: center; margin-bottom: 4px;">
          <input tuiRadio type="radio" formControlName="alcohol" value="NO" />
          Не пьет
        </label>
        <label tuiLabel style="display: flex; align-items: center; margin-bottom: 4px;">
          <input tuiRadio type="radio" formControlName="alcohol" value="YES" />
          Пьет
        </label>
        <label tuiLabel style="display: flex; align-items: center;">
          <input tuiRadio type="radio" formControlName="alcohol" value="ANY" />
          Не важно
        </label>
      </div>

      <div>
        <div style="font-weight: 500; margin-bottom: 8px;">Животные</div>
        <label tuiLabel style="display: flex; align-items: center; margin-bottom: 4px;">
          <input tuiRadio type="radio" formControlName="petFriendly" value="YES" />
          Не против животных
        </label>
        <label tuiLabel style="display: flex; align-items: center; margin-bottom: 4px;">
          <input tuiRadio type="radio" formControlName="petFriendly" value="NO" />
          Против животных
        </label>
        <label tuiLabel style="display: flex; align-items: center;">
          <input tuiRadio type="radio" formControlName="petFriendly" value="ANY" />
          Не важно
        </label>
      </div>

      <div>
        <div style="font-weight: 500; margin-bottom: 8px;">Чистоплотность</div>
        <label tuiLabel style="display: flex; align-items: center; margin-bottom: 4px;">
          <input tuiRadio type="radio" formControlName="isClean" value="YES" />
          Чистоплотный
        </label>
        <label tuiLabel style="display: flex; align-items: center; margin-bottom: 4px;">
          <input tuiRadio type="radio" formControlName="isClean" value="NO" />
          Не чистоплотный
        </label>
        <label tuiLabel style="display: flex; align-items: center;">
          <input tuiRadio type="radio" formControlName="isClean" value="ANY" />
          Не важно
        </label>
      </div>
    </div>
    <div class="new-ad-field-container">
        <tui-input-range class="half"
            [min]='minAge'
            [max]='maxAge'
            formControlName="coliverAge"
        >
            <label tuiLabel>Возраст коливера</label>
        </tui-input-range>

        <tui-textfield tuiChevron [stringify]="stringifyGenderColivers" class="half">
                <input
                    tuiSelect
                    formControlName="coliversGender"
                    placeholder="Выберите пол будующего коливера"
                />

                <tui-data-list *tuiTextfieldDropdown>
                    <button
                        *ngFor="let item of genderOptions"
                        new
                        tuiOption
                        type="button"
                        [value]="item.gender"
                    >
                        {{ item.label }}
                    </button>
                </tui-data-list>
        </tui-textfield>
    </div>

    <tui-textfield>
        <label tuiLabel>Дополнительная информация</label>
        <textarea
            placeholder="Введите допольнительную информацию"
            tuiTextarea
        ></textarea>
    </tui-textfield>

    <div class="new-ad-field-container">
        <button type="button" tuiButton class="half">
                Назад
        </button>
    
        <button type="button" tuiButton class="half">
            Сохранить
        </button>
    </div>
</form>
